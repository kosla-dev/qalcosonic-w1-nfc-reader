# ESPHome secrets example
#
# Copy this file to:
#
#   secrets.yaml
#
# and replace all example values with your own.
#
# Never commit your real secrets.yaml file.


# Wi-Fi
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"


# ESPHome fallback access point
fallback_password: "CHANGE_ME"


# Home Assistant native API encryption key
#
# Generate with ESPHome or use the key created when adding the device.
api_key: "YOUR_API_ENCRYPTION_KEY"


# ESPHome OTA update password
ota_password: "YOUR_OTA_PASSWORD"
